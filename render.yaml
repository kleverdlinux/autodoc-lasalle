services:
  - type: web
    name: autodoc-lasalle
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: autodoc-lasalle-db
          property: connectionString

databases:
  - name: autodoc-lasalle-db
    plan: free
    databaseName: autodoc_lasalle
    user: autodoc_admin
